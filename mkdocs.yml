site_name: Discounting cash flows when expected returns move
site_description: When expected returns move, one rate is the wrong tool
site_url: https://tlorans.github.io/varvaluation/
repo_url: https://github.com/tlorans/varvaluation
repo_name: tlorans/varvaluation
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: blue
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Light mode
  font:
    text: Source Serif 4
    code: Source Code Pro
  features:
    - navigation.sections
    - content.code.copy
    - toc.follow

nav:
  - Abstract: index.md
  - 1. Introduction: guide/introduction.md
  - 2. Framework:
      - The joint system: guide/system.md
      - Present value: guide/valuation.md
      - The state: guide/spec.md
  - 3. Estimation: guide/estimate.md
  - 4. Return news: guide/news.md
  - 5. Illustration: guide/walkthrough.md
  - 6. Discussion: guide/practice.md
  - Software:
      - Install: install.md
      - API: api.md
      - Public data: guide/data.md
      - WRDS / firms: guide/wrds.md
      - Synthetic: quickstart.md
  - References: references.md

exclude_docs: |
  superpowers/

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js
  - javascripts/math.js

extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tlorans/varvaluation
