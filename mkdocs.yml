site_name: Explain asset values from data
site_description: Which state variables drive asset values — a handbook. The joint VAR is the framework, not the program.
site_url: https://tlorans.github.io/varvaluation/
repo_url: https://github.com/tlorans/varvaluation
repo_name: tlorans/varvaluation
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: blue
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Light mode
  font:
    text: Source Serif 4
    code: Source Code Pro
  features:
    - navigation.sections
    - navigation.footer
    - content.code.copy
    - toc.follow

nav:
  - Home: index.md
  - 01 The research program: guide/program.md
  - 02 Getting started:
      - Start here: guide/start.md
      - Why a product: guide/introduction.md
  - 03 The framework:
      - The VAR: guide/system.md
      - Present value: guide/valuation.md
      - The state: guide/spec.md
  - 04 Measurement:
      - Estimate: guide/estimate.md
      - Public data: guide/data.md
  - 05 What moved the return: guide/news.md
  - 06 Firms:
      - WRDS / panel: guide/wrds.md
      - Three curves: guide/walkthrough.md
      - For valuators: guide/practice.md
  - Software:
      - Install: install.md
      - API: api.md
      - Synthetic check: quickstart.md
  - References: references.md

exclude_docs: |
  superpowers/

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js
  - javascripts/math.js

extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tlorans/varvaluation
