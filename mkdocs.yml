site_name: Cash flows and discount rates from one VAR
site_description: Cash-flow expectations and spot discount rates μ_t(n) from one joint VAR.
site_url: https://tlorans.github.io/varvaluation/
repo_url: https://github.com/tlorans/varvaluation
repo_name: tlorans/varvaluation
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: blue
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Light mode
  font:
    text: Source Serif 4
    code: Source Code Pro
  features:
    - navigation.sections
    - navigation.footer
    - content.code.copy
    - toc.follow

nav:
  - Home: index.md
  - Beginner guide:
      - Core idea: guide/core.md
      - The state variable: guide/state-variable.md
      - The VAR dynamics: guide/var-dynamics.md
      - Cash-flow dynamics: guide/cash-flow-dynamics.md
      - Expected returns: guide/expected-returns.md
      - Putting it together: guide/putting-together.md
  - Ang and Liu (2004): guide/angliu.md
  - Software:
      - Install: install.md
      - API: api.md
      - Offline check: quickstart.md
  - References: references.md

exclude_docs: |
  superpowers/
  guide/data.md
  guide/estimate.md
  guide/introduction.md
  guide/news.md
  guide/practice.md
  guide/pricing.md
  guide/program.md
  guide/spec.md
  guide/start.md
  guide/valuation.md
  guide/walkthrough.md
  guide/wrds.md
  guide/reproduce.md
  guide/industries.md
  guide/problem.md
  guide/system.md
  guide/curve.md
  guide/state.md
  guide/literature.md

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js
  - javascripts/math.js

extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tlorans/varvaluation
