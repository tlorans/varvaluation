[project]
name = "varvaluation"
version = "0.1.0"
description = "Cash-flow and discount-rate forecasts from one VAR"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Thomas Lorans" }]
keywords = [
    "valuation",
    "VAR",
    "discount-rate",
    "cash-flow",
    "asset-pricing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "polars>=1.0",
    "pandera>=0.20",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
data = ["pandas-datareader>=0.11", "pyarrow>=15.0", "openpyxl>=3.1"]
wrds = ["wrds>=3.2", "python-dotenv>=1.0", "pyarrow>=15.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "matplotlib>=3.7"]

[project.urls]
Homepage = "https://tlorans.github.io/varvaluation/"
Documentation = "https://tlorans.github.io/varvaluation/"
Repository = "https://github.com/tlorans/varvaluation"
Course = "https://github.com/tlorans/var_valuation"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/varvaluation"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["wrds: needs a live WRDS connection"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
